name: Upload Prebuilt Artifacts as Release

on:
  push:
    tags:
      - 'v*'  # Matches tags like v1.0.0, v2.3.4, etc.

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Extract version from tag
        id: extract_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.extract_version.outputs.version }}
          name: Release ${{ steps.extract_version.outputs.version }}
          files: |
            release/filepatrol-linux-amd64.zip
            release/filepatrol-mac-amd64.zip
            release/filepatrol-win32.zip
            release/filepatrol-windows-amd64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
